<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интерактивная карта пораженных объектов</title>
    <meta name="description" content="Карта пораженных промышленных и военных объектов с детальной информацией.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        slate: {
                            850: '#151e2e',
                            900: '#0f172a',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
        }

        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Glassmorphism Sidebar */
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Leaflet Popup overrides for Glassmorphism */
        .leaflet-popup-content-wrapper {
            background: rgba(30, 41, 59, 0.85) !important;
            backdrop-filter: blur(16px) !important;
            -webkit-backdrop-filter: blur(16px) !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.2) !important;
            color: white !important;
            border-radius: 1rem !important;
            padding: 0 !important;
            overflow: hidden;
        }
        
        .leaflet-popup-content {
            margin: 0 !important;
            width: 320px !important;
        }

        .leaflet-popup-tip {
            background: rgba(30, 41, 59, 0.9) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
        }

        .leaflet-container a.leaflet-popup-close-button {
            color: rgba(255, 255, 255, 0.6) !important;
            padding: 12px !important;
            width: 24px !important;
            height: 24px !important;
            font-size: 20px !important;
            z-index: 10;
        }

        .leaflet-container a.leaflet-popup-close-button:hover {
            color: white !important;
            background: transparent !important;
        }

        /* Custom Scrollbar for sidebar list */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Leaflet Controls dark mode */
        .leaflet-control-zoom a {
            background-color: rgba(30, 41, 59, 0.9) !important;
            color: white !important;
            border-color: rgba(255, 255, 255, 0.1) !important;
        }
        .leaflet-control-zoom a:hover {
            background-color: rgba(51, 65, 85, 0.9) !important;
        }
    </style>
</head>
<body class="text-slate-100">

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Sidebar Overlay -->
    <div class="absolute top-0 left-0 h-full w-full md:w-96 p-4 z-[1000] pointer-events-none flex flex-col">
        <div class="glass-panel rounded-2xl flex flex-col h-full pointer-events-auto transition-transform duration-300 transform translate-x-0" id="sidebar">
            
            <!-- Header -->
            <div class="p-6 border-b border-slate-700/50 shrink-0">
                <div class="flex justify-between items-center mb-4">
                    <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-indigo-400">
                        Пораженные объекты
                    </h1>
                    <!-- Mobile toggle button -->
                    <button id="toggleSidebarBtn" class="md:hidden text-slate-400 hover:text-white transition">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
                
                <!-- Search -->
                <div class="relative">
                    <input type="text" id="searchInput" placeholder="Поиск по названию или региону..." 
                        class="w-full bg-slate-800/50 border border-slate-600/50 rounded-xl py-2.5 pl-10 pr-4 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 transition-all placeholder-slate-400 text-white">
                    <svg class="absolute left-3 top-3 h-4 w-4 text-slate-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </div>

                <!-- Filters -->
                <div class="mt-4 flex flex-wrap gap-2" id="filterContainer">
                    <button class="filter-btn active px-3 py-1 text-xs font-medium rounded-full bg-blue-500/20 text-blue-300 border border-blue-500/30 transition hover:bg-blue-500/30" data-filter="all">Все</button>
                    <button class="filter-btn px-3 py-1 text-xs font-medium rounded-full bg-slate-700/50 text-slate-300 border border-slate-600/50 transition hover:bg-slate-600/50" data-filter="Нефтегаз">Нефтегаз</button>
                    <button class="filter-btn px-3 py-1 text-xs font-medium rounded-full bg-slate-700/50 text-slate-300 border border-slate-600/50 transition hover:bg-slate-600/50" data-filter="Топливная логистика">Логистика</button>
                    <button class="filter-btn px-3 py-1 text-xs font-medium rounded-full bg-slate-700/50 text-slate-300 border border-slate-600/50 transition hover:bg-slate-600/50" data-filter="ВПК">ВПК / Авиабазы</button>
                </div>
            </div>

            <!-- List of Objects -->
            <div class="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-3" id="objectList">
                <!-- Items will be generated here -->
            </div>
            
            <!-- Footer Stats -->
            <div class="p-4 border-t border-slate-700/50 shrink-0 text-xs text-slate-400 flex justify-between items-center">
                <span>Всего объектов: <span id="totalCount" class="font-bold text-white">0</span></span>
                <span class="text-slate-500">Обновлено: Июнь 2026</span>
            </div>
        </div>
    </div>

    <!-- Mobile Open Button (visible only when sidebar is closed on mobile) -->
    <button id="openSidebarBtn" class="fixed bottom-6 right-6 md:hidden z-[900] bg-blue-600 hover:bg-blue-700 text-white p-4 rounded-full shadow-lg transition-transform transform scale-0 pointer-events-auto">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
    </button>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Data Source -->
    <script src="data.js"></script>
    <!-- Main App Logic -->
    <script src="app.js"></script>
</body>
</html>
