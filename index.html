<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            const errorDiv = document.createElement('div');
            errorDiv.style.position = 'fixed';
            errorDiv.style.top = '0';
            errorDiv.style.left = '0';
            errorDiv.style.width = '100%';
            errorDiv.style.backgroundColor = '#f8d7da';
            errorDiv.style.color = '#721c24';
            errorDiv.style.padding = '15px';
            errorDiv.style.zIndex = '999999';
            errorDiv.style.fontSize = '14px';
            errorDiv.style.borderBottom = '3px solid #f5c6cb';
            errorDiv.style.fontFamily = 'monospace';
            errorDiv.style.whiteSpace = 'pre-wrap';
            errorDiv.style.boxSizing = 'border-box';
            errorDiv.innerHTML = '<strong>JS Error:</strong> ' + message + ' at ' + source + ':' + lineno + ':' + colno + '<br>' + (error ? error.stack : '');
            document.body.appendChild(errorDiv);
            return false;
        };
        window.onunhandledrejection = function(event) {
            const errorDiv = document.createElement('div');
            errorDiv.style.position = 'fixed';
            errorDiv.style.top = '0';
            errorDiv.style.left = '0';
            errorDiv.style.width = '100%';
            errorDiv.style.backgroundColor = '#f8d7da';
            errorDiv.style.color = '#721c24';
            errorDiv.style.padding = '15px';
            errorDiv.style.zIndex = '999999';
            errorDiv.style.fontSize = '14px';
            errorDiv.style.borderBottom = '3px solid #f5c6cb';
            errorDiv.style.fontFamily = 'monospace';
            errorDiv.style.whiteSpace = 'pre-wrap';
            errorDiv.style.boxSizing = 'border-box';
            errorDiv.innerHTML = '<strong>Promise Rejection:</strong> ' + event.reason;
            document.body.appendChild(errorDiv);
        };
    </script>
    <title data-i18n="title">Struck Facilities</title>
    <meta name="description" content="Map of struck industrial and military facilities in Russia with detailed information. Available in Ukrainian, Russian and English.">
    <link rel="icon" type="image/webp" href="favicon.webp">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- MapLibre GL CSS -->
    <link href="https://unpkg.com/maplibre-gl@4.0.2/dist/maplibre-gl.css" rel="stylesheet" />

    <style>
        :root {
            --bg-body: #0f172a;
            --bg-panel: rgba(15, 23, 42, 0.75);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --bg-input: rgba(30, 41, 59, 0.5);
            --bg-item: rgba(30, 41, 59, 0.3);
            --bg-item-hover: rgba(30, 41, 59, 0.6);
            --leaflet-popup-bg: rgba(30, 41, 59, 0.85);
            --leaflet-popup-border: rgba(255, 255, 255, 0.15);
            --filter-bg: rgba(51, 65, 85, 0.5);
            --filter-border: rgba(71, 85, 105, 0.5);
        }

        [data-theme="light"] {
            --bg-body: #f8fafc;
            --bg-panel: rgba(255, 255, 255, 0.85);
            --border-color: rgba(0, 0, 0, 0.1);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --bg-input: rgba(241, 245, 249, 0.8);
            --bg-item: rgba(241, 245, 249, 0.5);
            --bg-item-hover: rgba(226, 232, 240, 0.8);
            --leaflet-popup-bg: rgba(255, 255, 255, 0.95);
            --leaflet-popup-border: rgba(0, 0, 0, 0.1);
            --filter-bg: rgba(241, 245, 249, 0.8);
            --filter-border: rgba(203, 213, 225, 0.8);
        }

        [data-theme="beige"] {
            --bg-body: #f4ebd8;
            --bg-panel: rgba(238, 227, 211, 0.9);
            --border-color: rgba(139, 90, 43, 0.25);
            --text-main: #3e2723;
            --text-muted: #6d4c41;
            --bg-input: rgba(215, 204, 184, 0.7);
            --bg-item: rgba(215, 204, 184, 0.5);
            --bg-item-hover: rgba(215, 204, 184, 0.9);
            --leaflet-popup-bg: rgba(244, 235, 216, 0.95);
            --leaflet-popup-border: rgba(139, 90, 43, 0.3);
            --filter-bg: rgba(215, 204, 184, 0.7);
            --filter-border: rgba(188, 170, 164, 0.8);
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            transition: background-color 0.3s, color 0.3s;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-variant-numeric: tabular-nums;
        }

        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Glassmorphism Sidebar */
        .glass-panel {
            background: var(--bg-panel);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: background-color 0.3s, border-color 0.3s, box-shadow 0.3s;
        }

        /* Leaflet Popup overrides for Glassmorphism */
        .leaflet-popup-content-wrapper {
            background: var(--leaflet-popup-bg) !important;
            backdrop-filter: blur(16px) !important;
            -webkit-backdrop-filter: blur(16px) !important;
            border: 1px solid var(--leaflet-popup-border) !important;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.1) !important;
            color: var(--text-main) !important;
            border-radius: 1rem !important;
            padding: 0 !important;
            overflow: hidden;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }
        
        .leaflet-popup-content {
            margin: 0 !important;
        }

        /* Mobile-first popup styles */

        /* Custom Leaflet Popup Layout (PC version with image) */
        @media (min-width: 768px) {
            /* Removed legacy CSS layout, now handled via Tailwind in app.js */
        }

        .leaflet-popup-tip {
            background: var(--leaflet-popup-bg) !important;
            border: 1px solid var(--border-color) !important;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .leaflet-container a.leaflet-popup-close-button {
            color: var(--text-muted) !important;
            top: -12px !important;
            right: -12px !important;
            width: 30px !important;
            height: 30px !important;
            padding: 0 !important;
            font-size: 22px !important;
            line-height: 28px !important;
            text-align: center !important;
            z-index: 100;
            border-radius: 50%;
            background: var(--bg-panel) !important;
            border: 1px solid var(--border-color) !important;
            backdrop-filter: blur(12px) !important;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .leaflet-container a.leaflet-popup-close-button:hover {
            color: var(--text-main) !important;
            background: var(--bg-item-hover) !important;
            transform: scale(1.1);
        }

        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(128, 128, 128, 0.1);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(128, 128, 128, 0.3);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(128, 128, 128, 0.5);
        }

        /* Leaflet Controls */
        .leaflet-control-zoom a {
            background-color: var(--bg-panel) !important;
            color: var(--text-main) !important;
            border-color: var(--border-color) !important;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }
        .leaflet-control-zoom a:hover {
            background-color: var(--bg-item-hover) !important;
        }

        /* Utility classes using CSS vars */
        .theme-bg-input { background-color: var(--bg-input); }
        .theme-border { border-color: var(--border-color); }
        .theme-text-muted { color: var(--text-muted); }
        .theme-text-main { color: var(--text-main); }
        .theme-bg-item { background-color: var(--bg-item); }
        .theme-hover-bg-item:hover { background-color: var(--bg-item-hover); }
        .theme-filter-bg { background-color: var(--filter-bg); border-color: var(--filter-border); color: var(--text-main); }
        .theme-filter-bg:hover { background-color: var(--bg-item-hover); }

        /* Custom Lang Selector */
        .lang-active {
            background-color: var(--text-main) !important;
            color: var(--bg-body) !important;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }

        /* === Photo Badge (camera icon + count) === */
        .photo-badge {
            position: absolute;
            top: 7px;
            right: 8px;
            display: flex;
            align-items: center;
            gap: 3px;
            padding: 3px 6px 3px 5px;
            border-radius: 20px;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            transition: background-color 0.2s, color 0.2s, border-color 0.2s, transform 0.15s;
            pointer-events: none;
            z-index: 2;
        }
        .group:hover .photo-badge {
            color: var(--text-main);
            transform: scale(1.05);
        }
        .photo-badge-icon {
            width: 13px;
            height: 13px;
            flex-shrink: 0;
        }
        .photo-badge-count {
            font-size: 10px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: 0.02em;
        }
    </style>
</head>
<body>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Sidebar Overlay -->
    <div class="absolute top-0 left-0 h-full w-full md:w-96 p-0 md:p-4 z-[1000] pointer-events-none flex flex-col overflow-hidden">
        <div class="glass-panel rounded-none md:rounded-2xl flex flex-col h-full pointer-events-auto transition-transform duration-300 transform -translate-x-full md:translate-x-0" id="sidebar">
            <!-- Header -->
            <div class="p-4 pb-2.5 border-b theme-border shrink-0 relative">
                <div class="flex justify-between items-start mb-2.5">
                    <h1 class="text-xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-indigo-500 dark:from-blue-400 dark:to-indigo-400 tracking-tight" style="text-wrap: balance;" data-i18n="title">Пораженные объекты</h1>
                    <!-- Mobile toggle button -->
                    <button id="toggleSidebarBtn" class="md:hidden absolute top-4 right-4 theme-text-muted hover:theme-text-main transition bg-slate-100 dark:bg-slate-800 p-1.5 rounded-full z-50">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>

                <!-- Controls Row -->
                <div class="flex justify-between items-center mb-2.5">
                    <!-- Theme Selector -->
                    <div class="flex gap-2 p-1 rounded-full theme-bg-input border theme-border">
                        <button class="w-6 h-6 rounded-full border-2 border-slate-700 bg-[#0f172a] shadow-sm theme-selector hover:scale-110 transition-transform duration-200" data-set-theme="dark" title="Тёмная тема"></button>
                        <button class="w-6 h-6 rounded-full border-2 border-slate-300 bg-[#f8fafc] shadow-sm theme-selector hover:scale-110 transition-transform duration-200" data-set-theme="light" title="Светлая тема"></button>
                        <button class="w-6 h-6 rounded-full border-2 border-[#bcaaa4] bg-[#f4ebd8] shadow-sm theme-selector hover:scale-110 transition-transform duration-200" data-set-theme="beige" title="Бежевая тема"></button>
                    </div>

                    <!-- Language Selector -->
                    <div class="flex p-0.5 rounded-full theme-bg-input border theme-border shadow-inner">
                        <button class="lang-selector theme-text-muted px-3 py-0.5 text-xs font-bold rounded-full transition-all duration-300" data-set-lang="uk">UK</button>
                        <button class="lang-selector theme-text-muted px-3 py-0.5 text-xs font-bold rounded-full transition-all duration-300" data-set-lang="ru">RU</button>
                        <button class="lang-selector theme-text-muted px-3 py-0.5 text-xs font-bold rounded-full transition-all duration-300" data-set-lang="en">EN</button>
                    </div>
                </div>
                
                <!-- Search & Month Filter & Sort -->
                <div class="flex gap-2 mb-2.5">
                    <div class="relative flex-1">
                        <input type="text" id="searchInput" data-i18n-placeholder="search" placeholder="Поиск по названию или региону..." class="w-full pl-9 pr-3 py-2 theme-bg-input border theme-border rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/50 theme-transition text-xs">
                        <svg class="absolute left-3 top-2.5 h-3.5 w-3.5 theme-text-muted" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                    </div>
                    
                    <div class="relative max-w-[120px] z-50" id="customDropdownContainer">
                        <!-- Кнопка, имитирующая select -->
                        <button id="customDropdownBtn" class="flex items-center justify-between w-full px-2.5 py-2 theme-bg-input border theme-border rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/50 theme-transition text-xs cursor-pointer">
                            <span id="customDropdownText" class="truncate" data-i18n="filter_all">Всі місяці</span>
                            <svg class="w-3.5 h-3.5 ml-1.5 theme-text-muted transition-transform duration-200 shrink-0" id="customDropdownIcon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </button>

                        <!-- Выпадающее меню с эффектом glass-panel -->
                        <div id="customDropdownMenu" class="absolute top-full right-0 mt-2 w-48 glass-panel rounded-xl border theme-border shadow-xl opacity-0 invisible transition-all duration-200 translate-y-[-10px] overflow-hidden">
                            <ul id="customDropdownList" class="py-1 max-h-60 overflow-y-auto custom-scrollbar">
                                <!-- Сюда динамически добавляются li -->
                            </ul>
                        </div>

                        <!-- Оригинальный select делаем скрытым для сохранения логики -->
                        <select id="monthFilter" class="hidden"></select>
                    </div>

                    <!-- Sort Button -->
                    <button id="sortToggleBtn" class="flex items-center justify-center w-8 h-8 theme-bg-input border theme-border rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/50 theme-transition cursor-pointer shrink-0" title="Сортировка по дате">
                        <svg class="w-4 h-4 theme-text-main transition-transform duration-300" id="sortIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h13M3 8h9M3 12h6M17 10v6m0 0l-3-3m3 3l3-3" />
                        </svg>
                    </button>
                </div>

                <!-- Filters -->
                <div class="flex flex-nowrap overflow-x-auto gap-2 mb-1.5 no-scrollbar" id="filters">
                    <button class="filter-btn active shrink-0 px-3 py-1.5 rounded-full text-xs font-medium theme-transition bg-blue-500/20 text-blue-500 border border-blue-500/30" data-filter="all" data-i18n="filter_all">Все</button>
                    <button class="filter-btn shrink-0 px-3 py-1.5 rounded-full text-xs font-medium theme-transition theme-filter-bg border" data-filter="Нефтегаз" data-i18n="filter_oil">Нефтегаз</button>
                    <button class="filter-btn shrink-0 px-3 py-1.5 rounded-full text-xs font-medium theme-transition theme-filter-bg border" data-filter="Топливная логистика" data-i18n="filter_logistics">Логистика</button>
                    <button class="filter-btn shrink-0 px-3 py-1.5 rounded-full text-xs font-medium theme-transition theme-filter-bg border" data-filter="ВПК / Авиабазы" data-i18n="filter_military">ВПК / Авиабазы</button>
                </div>
            </div>

            <!-- List of Objects -->
            <div class="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-3" id="objectList">
                <!-- Items will be generated here -->
            </div>
            
            <!-- Footer Stats -->
            <div class="p-4 border-t theme-border flex justify-between items-center text-xs text-slate-500 shrink-0">
                <span><span data-i18n="total">Всего объектов:</span> <strong id="totalCount" class="text-slate-700 dark:text-slate-300">0</strong></span>
                <span data-i18n="updated">Обновлено: Июнь 2026</span>
            </div>
        </div>
    </div>

    <!-- Mobile Open Button -->
    <button id="openSidebarBtn" class="md:hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-[1000] bg-blue-600 text-white px-5 py-3 rounded-full shadow-lg font-semibold flex items-center gap-2 hover:bg-blue-700 transition active:scale-95 border-2 border-white dark:border-slate-800">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        <span data-i18n="mobile_btn">Список объектов</span>
    </button>

    <!-- Welcome Toast -->
    <div id="welcomeToast" class="fixed bottom-24 left-1/2 -translate-x-1/2 z-[2000] w-[90%] max-w-sm glass-panel rounded-2xl shadow-2xl border border-blue-500/50 p-4 transition-all duration-500 translate-y-10 opacity-0 pointer-events-none hidden" style="background: var(--leaflet-popup-bg);">
        <div class="flex items-start gap-3">
            <div class="bg-blue-500/20 text-blue-500 p-2 rounded-full shrink-0">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
            <div class="text-sm font-medium theme-text-main leading-relaxed flex-1" data-i18n="onboarding">
                Тисни на мигаючу крапку на території Росії і дивися, що там демілітаризували в рамках еСВеО.
            </div>
            <button id="closeToastBtn" class="shrink-0 p-1 theme-text-muted hover:theme-text-main transition -mr-1 -mt-1">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
    </div>

    <!-- Fullscreen Image Modal -->
    <div id="imageModal" class="fixed inset-0 z-[3000] bg-black/90 hidden items-center justify-center backdrop-blur-sm transition-opacity duration-300 opacity-0 group">
        <div id="imageCounter" class="absolute top-6 left-6 text-white text-sm bg-black/50 px-3 py-1.5 rounded-full hidden"></div>
        <button id="closeImageModalBtn" class="absolute top-6 right-6 text-white hover:text-gray-300 transition-colors p-2 bg-black/50 rounded-full z-10">
            <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
        <button id="prevImageBtn" class="absolute left-4 top-1/2 -translate-y-1/2 text-white hover:text-gray-300 p-2 bg-black/50 rounded-full hidden z-10">
            <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </button>
        <button id="nextImageBtn" class="absolute right-4 top-1/2 -translate-y-1/2 text-white hover:text-gray-300 p-2 bg-black/50 rounded-full hidden z-10">
            <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        </button>
        <img id="modalImage" src="" alt="Fullscreen view" class="max-w-[95vw] max-h-[95vh] object-contain rounded-lg shadow-2xl transition-opacity duration-200">
        <video id="modalVideo" src="" class="max-w-[95vw] max-h-[95vh] object-contain rounded-lg shadow-2xl transition-opacity duration-200 hidden" controls autoplay playsinline></video>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- MapLibre GL JS -->
    <script src="https://unpkg.com/maplibre-gl@4.0.2/dist/maplibre-gl.js"></script>
    <!-- MapLibre GL Leaflet Plugin -->
    <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.3/leaflet-maplibre-gl.js"></script>
    
    <!-- Data Source -->
    <script src="data.js?v=22"></script>
    <!-- Main App Logic -->
    <script src="app.js?v=25"></script>
</body>
</html>
